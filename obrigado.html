<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem enviada - GM Vídeo</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        }

        .thank-you {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }

        .thank-you-card {
            max-width: 600px;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.1);
            padding: 3rem 2rem;
            text-align: center;
        }

        .thank-you-card h1 {
            color: #1e293b;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .thank-you-card p {
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <h1>GM Vídeo</h1>
                </div>
                <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="trabalhos.html">Portfólio</a></li>
                    <li><a href="planos.html">Planos</a></li>
                    <li><a href="contato.html" class="btn-contact">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="thank-you">
        <div class="thank-you-card">
            <h1>Mensagem enviada com sucesso!</h1>
            <p>Obrigado pelo contato. Sua mensagem foi enviada para a GM Vídeo e em breve entraremos em contato.</p>
            <a href="index.html" class="btn btn-primary">Voltar para o início</a>
        </div>
    </main>

    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');

        if (navToggle && navLinks) {
            navToggle.addEventListener('click', () => {
                const isOpen = navLinks.classList.toggle('is-open');
                navToggle.setAttribute('aria-expanded', String(isOpen));
                navToggle.setAttribute('aria-label', isOpen ? 'Fechar menu' : 'Abrir menu');
            });

            navLinks.querySelectorAll('a').forEach((link) => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('is-open');
                    navToggle.setAttribute('aria-expanded', 'false');
                    navToggle.setAttribute('aria-label', 'Abrir menu');
                });
            });

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    navLinks.classList.remove('is-open');
                    navToggle.setAttribute('aria-expanded', 'false');
                    navToggle.setAttribute('aria-label', 'Abrir menu');
                }
            });
        }
    </script>
</body>
</html>
